<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubSync Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,900;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --red: #d62828; --red-dark: #b01f1f; --red-light: #fce8e8;
  --cream: #fff3e0; --cream-dark: #ffe0b2;
  --ink: #0f0a00; --ink-light: #3d3020; --muted: #8a7560;
  --border: #e8ddd0; --white: #ffffff; --bg: #faf8f5;
  --green: #16a34a; --amber: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg); color: var(--ink);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}

/* Login */
#login-screen {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  background: var(--cream);
}
.login-box {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 20px; padding: 48px 44px;
  width: 100%; max-width: 400px;
  box-shadow: 0 24px 48px rgba(0,0,0,0.06);
}
.login-logo {
  font-family: 'Fraunces', serif; font-size: 24px; font-weight: 900;
  color: var(--ink); margin-bottom: 6px;
}
.login-logo em { color: var(--red); font-style: normal; }
.login-box p { font-size: 14px; color: var(--muted); margin-bottom: 28px; font-weight: 300; }
.login-box input {
  width: 100%; padding: 12px 14px;
  border: 1.5px solid var(--border); border-radius: 10px;
  font-size: 14px; font-family: 'DM Sans', sans-serif;
  outline: none; margin-bottom: 12px; color: var(--ink);
}
.login-box input:focus { border-color: var(--red); }
.btn { display: inline-flex; align-items: center; gap: 6px;
       padding: 10px 18px; border-radius: 8px; font-size: 14px;
       font-weight: 600; border: none; cursor: pointer;
       font-family: 'DM Sans', sans-serif; transition: all 0.15s; }
.btn-primary { background: var(--red); color: white; width: 100%;
               justify-content: center; padding: 13px; }
.btn-primary:hover { background: var(--red-dark); }
.btn-green  { background: var(--green); color: white; }
.btn-green:hover { opacity: 0.9; }
.btn-outline { background: white; color: var(--ink);
               border: 1.5px solid var(--border); }
.btn-outline:hover { border-color: var(--ink); }
.btn-sm { padding: 7px 14px; font-size: 13px; }
.error-msg { color: var(--red); font-size: 13px; margin-top: 8px; }

/* App */
#app { display: none; }

header {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 32px; height: 64px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.header-logo {
  font-family: 'Fraunces', serif; font-size: 20px; font-weight: 900; color: var(--ink);
}
.header-logo em { color: var(--red); font-style: normal; }
.header-company { font-size: 13px; color: var(--muted); margin-left: 12px; font-weight: 300; }
.logout-btn {
  background: none; border: 1.5px solid var(--border); color: var(--ink-light);
  padding: 7px 14px; border-radius: 8px; cursor: pointer;
  font-size: 13px; font-family: 'DM Sans', sans-serif; transition: all 0.15s;
}
.logout-btn:hover { border-color: var(--red); color: var(--red); }

main { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

/* Stats */
.cards {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
  background: var(--border); border: 1px solid var(--border);
  border-radius: 16px; overflow: hidden; margin-bottom: 32px;
}
@media(max-width:700px) { .cards { grid-template-columns: repeat(2,1fr); } }
.card { background: var(--white); padding: 24px 28px; }
.card-label {
  font-size: 11px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 0.8px; font-weight: 600; margin-bottom: 8px;
}
.card-value {
  font-family: 'Fraunces', serif;
  font-size: 36px; font-weight: 900; color: var(--ink);
  letter-spacing: -1px; line-height: 1;
}
.card-value.red { color: var(--red); }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 300; }

/* Section titles */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  margin: 32px 0 16px;
}
.section-title {
  font-family: 'Fraunces', serif;
  font-size: 20px; font-weight: 900; color: var(--ink);
  letter-spacing: -0.5px;
}
.count-badge {
  background: var(--red); color: white;
  font-size: 11px; font-weight: 700;
  padding: 3px 9px; border-radius: 100px;
  margin-left: 10px;
}

/* Site blocks */
.site-block {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 16px; margin-bottom: 16px; overflow: hidden;
}
.site-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 24px; background: var(--bg);
  border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px;
}
.site-name {
  font-family: 'Fraunces', serif;
  font-size: 17px; font-weight: 700; color: var(--ink);
  letter-spacing: -0.3px; display: flex; align-items: center; gap: 8px;
}
.site-meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 300; }
.site-actions { display: flex; gap: 8px; }

/* Table */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  padding: 10px 20px; text-align: left;
  font-size: 10px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.6px;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
td { padding: 13px 20px; border-bottom: 1px solid var(--border); color: var(--ink-light); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: var(--bg); }

.type-pill {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
  letter-spacing: 0.3px;
}
.type-VARIATION      { background: #fce8e8; color: var(--red); }
.type-DAYWORK        { background: #dcfce7; color: #15803d; }
.type-MATERIAL_ORDER { background: #fef3c7; color: #92400e; }
.type-TIMESHEET      { background: #ede9fe; color: #5b21b6; }
.type-UNKNOWN        { background: var(--bg); color: var(--muted); }

/* Sent section */
.sent-list { display: flex; flex-direction: column; gap: 8px; }
.sent-item {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 18px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; color: var(--ink-light);
}
.sent-item span { color: var(--muted); font-size: 12px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(15,10,0,0.5);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; padding: 20px;
}
.modal {
  background: white; border-radius: 20px; padding: 36px;
  width: 100%; max-width: 440px;
  box-shadow: 0 32px 64px rgba(0,0,0,0.15);
}
.modal h3 {
  font-family: 'Fraunces', serif;
  font-size: 22px; font-weight: 900; color: var(--ink);
  letter-spacing: -0.5px; margin-bottom: 6px;
}
.modal p { font-size: 14px; color: var(--muted); margin-bottom: 20px; font-weight: 300; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600;
                    color: var(--ink-light); margin-bottom: 6px; }
.form-group select, .form-group input {
  width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
  border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif;
  outline: none; color: var(--ink);
}
.form-group select:focus, .form-group input:focus { border-color: var(--red); }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

/* States */
.empty { text-align: center; padding: 48px; color: var(--muted); font-size: 14px; font-weight: 300; }
.loading { text-align: center; padding: 64px; color: var(--muted); }
.spinner {
  display: inline-block; width: 28px; height: 28px;
  border: 2.5px solid var(--border); border-top-color: var(--red);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--ink); color: white;
  padding: 12px 20px; border-radius: 10px;
  font-size: 14px; z-index: 300;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  animation: fadeUp 0.2s ease;
}
.toast.success { background: var(--green); }
.toast.error   { background: var(--red); }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">Sub<em>Sync</em></div>
    <p>Sign in to your dashboard</p>
    <input type="text" id="login-number" placeholder="Your WhatsApp number (+447...)" />
    <input type="password" id="login-password" placeholder="Dashboard password" />
    <button class="btn btn-primary" onclick="doLogin()">Sign in →</button>
    <p class="error-msg" id="login-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div style="display:flex;align-items:center">
      <div class="header-logo">Sub<em>Sync</em></div>
      <span class="header-company" id="company-name-header"></span>
    </div>
    <a href="/account" style="margin-right:8px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;border:1.5px solid var(--border);">My Account</a>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </header>

  <main>
    <div id="dashboard-content">
      <div class="loading"><div class="spinner"></div><br><br>Loading your dashboard...</div>
    </div>
  </main>
</div>

<!-- GENERATE MODAL -->
<div class="modal-overlay" id="generate-modal" style="display:none">
  <div class="modal">
    <h3>Generate document</h3>
    <p id="generate-modal-site"></p>
    <div class="form-group">
      <label>Document Type</label>
      <select id="gen-doc-type">
        <option value="VARIATION">Variation Order (VO)</option>
        <option value="DAYWORK">Daywork Sheet (DS)</option>
        <option value="MATERIAL_ORDER">Purchase Order (PO)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('generate-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmGenerate()">Generate PDF →</button>
    </div>
  </div>
</div>

<!-- EMAIL MODAL -->
<div class="modal-overlay" id="email-modal" style="display:none">
  <div class="modal">
    <h3>Send to client</h3>
    <p id="email-modal-doc"></p>
    <div class="form-group">
      <label>Client Email Address</label>
      <input type="email" id="email-to" placeholder="client@example.com" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('email-modal')">Cancel</button>
      <button class="btn btn-green" onclick="confirmSendEmail()">Send email →</button>
    </div>
  </div>
</div>

<script>
let STATE = { password: "", number: "", data: null, currentSite: null, currentPdf: null, currentDoc: null };

async function doLogin() {
  const number   = document.getElementById("login-number").value.trim();
  const password = document.getElementById("login-password").value.trim();
  if (!number || !password) { showLoginError("Please fill in both fields."); return; }

  const r = await fetch("/api/auth", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password })
  });
  const d = await r.json();
  if (d.ok) {
    STATE.password = password; STATE.number = number;
    localStorage.setItem("ss_password", password);
    localStorage.setItem("ss_number", number);
    showApp();
  } else { showLoginError("Wrong password. Try again."); }
}

function logout() {
  localStorage.removeItem("ss_password"); localStorage.removeItem("ss_number");
  STATE = { password: "", number: "", data: null, currentSite: null, currentPdf: null, currentDoc: null };
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}

function showLoginError(msg) { document.getElementById("login-error").textContent = msg; }

function apiFetch(url, opts = {}) {
  return fetch(url, { ...opts, headers: { "Content-Type": "application/json",
    "X-Dashboard-Password": STATE.password, ...(opts.headers || {}) } });
}

async function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  await loadDashboard();
}

async function loadDashboard() {
  document.getElementById("dashboard-content").innerHTML =
    `<div class="loading"><div class="spinner"></div><br><br>Loading...</div>`;
  const r = await apiFetch(`/api/summary?number=${encodeURIComponent(STATE.number)}`);
  const d = await r.json();
  STATE.data = d;
  document.getElementById("company-name-header").textContent =
    d.company?.company_name ? `— ${d.company.company_name}` : "";
  renderDashboard(d);
}

function renderDashboard(d) {
  const bySite = d.by_site || {};
  const sites  = Object.keys(bySite);

  let html = `
    <div class="cards">
      <div class="card">
        <div class="card-label">Pending Items</div>
        <div class="card-value red">${d.total_pending}</div>
        <div class="card-sub">Awaiting document generation</div>
      </div>
      <div class="card">
        <div class="card-label">Total Est. Value</div>
        <div class="card-value">£${(d.total_value||0).toFixed(0)}</div>
        <div class="card-sub">Across all pending items</div>
      </div>
      <div class="card">
        <div class="card-label">Total Hours</div>
        <div class="card-value">${(d.total_hours||0).toFixed(1)}</div>
        <div class="card-sub">Logged pending hours</div>
      </div>
      <div class="card">
        <div class="card-label">Active Sites</div>
        <div class="card-value">${d.sites}</div>
        <div class="card-sub">Projects in progress</div>
      </div>
    </div>`;

  if (sites.length === 0) {
    html += `<div class="empty">✅ No pending items — all caught up!</div>`;
  } else {
    html += `
      <div class="section-header">
        <div class="section-title">Pending items <span class="count-badge">${d.total_pending}</span></div>
      </div>`;
    for (const site of sites) {
      html += renderSiteBlock(site, bySite[site], d.company);
    }
  }

  if (d.recent_sent?.length) {
    html += `<div class="section-header"><div class="section-title">Recently sent</div></div><div class="sent-list">`;
    for (const log of d.recent_sent) {
      const date = new Date(log.created_at).toLocaleDateString("en-GB");
      html += `<div class="sent-item">
        <div>
          <span class="type-pill type-${log.type}">${(log.type||"").replace("_"," ")}</span>
          &nbsp;&nbsp;${log.description || "—"}
          ${log.site_name ? `<span style="color:var(--muted)"> · ${log.site_name}</span>` : ""}
        </div>
        <span>${date}</span>
      </div>`;
    }
    html += `</div>`;
  }

  document.getElementById("dashboard-content").innerHTML = html;
}

function renderSiteBlock(site, s, company) {
  let rows = "";
  for (const log of s.logs) {
    const date = new Date(log.created_at).toLocaleDateString("en-GB");
    rows += `<tr>
      <td><span class="type-pill type-${log.type}">${(log.type||"").replace("_"," ")}</span></td>
      <td>${log.description || "—"}</td>
      <td>${log.location || "—"}</td>
      <td>${log.hours ? log.hours + " hrs" : "—"}</td>
      <td>${log.cost_estimate ? "£" + parseFloat(log.cost_estimate).toFixed(2) : "—"}</td>
      <td>${date}</td>
    </tr>`;
  }
  return `
    <div class="site-block">
      <div class="site-header">
        <div>
          <div class="site-name">📍 ${site}</div>
          <div class="site-meta">${s.count} item(s) · £${s.value.toFixed(2)} · ${s.hours.toFixed(1)} hrs</div>
        </div>
        <div class="site-actions">
          <button class="btn btn-outline btn-sm" onclick="openGenerateModal('${site}')">Generate PDF</button>
        </div>
      </div>
      <table>
        <thead><tr><th>Type</th><th>Description</th><th>Location</th><th>Hours</th><th>Est. Cost</th><th>Date</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function openGenerateModal(site) {
  STATE.currentSite = site;
  document.getElementById("generate-modal-site").textContent = `For: ${site}`;
  document.getElementById("generate-modal").style.display = "flex";
}

async function confirmGenerate() {
  const docType = document.getElementById("gen-doc-type").value;
  closeModal("generate-modal");
  showToast("Generating PDF...", "");
  const r = await apiFetch("/api/generate", {
    method: "POST",
    body: JSON.stringify({ site_name: STATE.currentSite, doc_type: docType, from_number: STATE.number })
  });
  const d = await r.json();
  if (d.ok) {
    STATE.currentPdf = d;
    showToast("✓ PDF generated!", "success");
    openEmailModal(d);
    await loadDashboard();
  } else { showToast("❌ " + (d.error || "Failed"), "error"); }
}

function openEmailModal(docData) {
  STATE.currentDoc = docData;
  document.getElementById("email-modal-doc").textContent =
    `${docData.doc_ref} ready (${docData.items} items). Send to client?`;
  document.getElementById("email-modal").style.display = "flex";
}

async function confirmSendEmail() {
  const to = document.getElementById("email-to").value.trim();
  if (!to) { showToast("Please enter an email address", "error"); return; }
  closeModal("email-modal");
  showToast("Sending email...", "");
  const r = await apiFetch("/api/send-email", {
    method: "POST",
    body: JSON.stringify({
      to_email: to, pdf_url: STATE.currentDoc.pdf_url,
      doc_ref: STATE.currentDoc.doc_ref, site_name: STATE.currentSite,
      company_name: STATE.data?.company?.company_name || "Company",
      filename: STATE.currentDoc.filename,
    })
  });
  const d = await r.json();
  if (d.ok) { showToast("✓ Email sent!", "success"); }
  else { showToast("❌ " + (d.error || "Failed"), "error"); }
}

function closeModal(id) { document.getElementById(id).style.display = "none"; }

function showToast(msg, type = "") {
  const t = document.createElement("div");
  t.className = `toast ${type}`; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

window.addEventListener("DOMContentLoaded", () => {
  const pw  = localStorage.getItem("ss_password");
  const num = localStorage.getItem("ss_number");
  if (pw && num) {
    document.getElementById("login-number").value   = num;
    document.getElementById("login-password").value = pw;
    STATE.password = pw; STATE.number = num;
    showApp();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("login-screen").style.display !== "none") doLogin();
});
</script>
</body>
</html>
