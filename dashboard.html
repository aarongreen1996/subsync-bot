<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubSync Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --brand: #1a3a6b;
    --brand-light: #2a5298;
    --accent: #f59e0b;
    --green: #10b981;
    --red: #ef4444;
    --bg: #f1f5f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  /* ── Login ── */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
  }
  .login-box {
    background: white; border-radius: 16px; padding: 48px 40px;
    width: 100%; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-box h1 { font-size: 26px; color: var(--brand); margin-bottom: 6px; }
  .login-box p  { color: var(--muted); margin-bottom: 28px; font-size: 14px; }
  .login-box input {
    width: 100%; padding: 12px 16px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 15px; outline: none; margin-bottom: 14px;
  }
  .login-box input:focus { border-color: var(--brand); }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 8px; font-size: 14px;
    font-weight: 600; border: none; cursor: pointer; transition: all .15s;
  }
  .btn-primary { background: var(--brand); color: white; width: 100%; justify-content: center; padding: 13px; }
  .btn-primary:hover { background: var(--brand-light); }
  .btn-green  { background: var(--green); color: white; }
  .btn-green:hover  { opacity: .9; }
  .btn-accent { background: var(--accent); color: white; }
  .btn-accent:hover { opacity: .9; }
  .btn-outline { background: white; color: var(--brand); border: 1.5px solid var(--brand); }
  .btn-outline:hover { background: var(--bg); }
  .btn-sm { padding: 7px 14px; font-size: 13px; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* ── Layout ── */
  #app { display: none; }
  header {
    background: var(--brand); color: white; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between; height: 60px;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  header h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; }
  header span { font-size: 13px; opacity: .75; margin-left: 12px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .logout-btn { background: rgba(255,255,255,.15); border: none; color: white;
                padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; }
  .logout-btn:hover { background: rgba(255,255,255,.25); }

  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px; }

  /* ── Summary cards ── */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  @media(max-width:700px) { .cards { grid-template-columns: repeat(2,1fr); } }
  .card {
    background: var(--card); border-radius: 12px; padding: 20px 22px;
    border: 1px solid var(--border); box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .card-label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .5px; margin-bottom: 6px; }
  .card-value { font-size: 28px; font-weight: 700; color: var(--brand); }
  .card-sub   { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* ── Section titles ── */
  .section-title {
    font-size: 17px; font-weight: 700; color: var(--brand);
    margin: 28px 0 14px; display: flex; align-items: center; gap: 10px;
  }
  .badge {
    display: inline-block; background: var(--brand); color: white;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
  }
  .badge-amber { background: var(--accent); }

  /* ── Site blocks ── */
  .site-block {
    background: var(--card); border-radius: 12px; border: 1px solid var(--border);
    margin-bottom: 20px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04);
  }
  .site-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; background: #f8fafc; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 10px;
  }
  .site-name { font-weight: 700; font-size: 15px; color: var(--brand); }
  .site-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .site-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ── Logs table ── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f1f5f9; color: var(--muted); font-size: 11px; text-transform: uppercase;
       letter-spacing: .4px; padding: 10px 16px; text-align: left; }
  td { padding: 11px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .type-badge {
    display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px;
    border-radius: 4px; text-transform: uppercase; letter-spacing: .3px;
  }
  .type-VARIATION     { background: #dbeafe; color: #1e40af; }
  .type-DAYWORK       { background: #d1fae5; color: #065f46; }
  .type-MATERIAL_ORDER{ background: #fef3c7; color: #92400e; }
  .type-TIMESHEET     { background: #ede9fe; color: #5b21b6; }
  .type-UNKNOWN       { background: #f1f5f9; color: #475569; }

  /* ── Recent sent ── */
  .sent-list { display: flex; flex-direction: column; gap: 8px; }
  .sent-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 16px; font-size: 13px;
  }
  .sent-item span { color: var(--muted); font-size: 12px; }

  /* ── Modal ── */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; padding: 20px;
  }
  .modal {
    background: white; border-radius: 14px; padding: 32px;
    width: 100%; max-width: 440px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal h3 { font-size: 18px; color: var(--brand); margin-bottom: 6px; }
  .modal p  { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 600;
                      color: var(--text); margin-bottom: 6px; }
  .form-group select, .form-group input {
    width: 100%; padding: 10px 12px; border: 1.5px solid var(--border);
    border-radius: 8px; font-size: 14px; outline: none;
  }
  .form-group select:focus, .form-group input:focus { border-color: var(--brand); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ── States ── */
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e2e8f0;
             border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast {
    position: fixed; bottom: 24px; right: 24px; background: var(--brand); color: white;
    padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 300;
    box-shadow: 0 4px 20px rgba(0,0,0,.25); animation: fadeIn .2s ease;
  }
  .toast.success { background: var(--green); }
  .toast.error   { background: var(--red); }
  @keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>⚡ SubSync</h1>
    <p>Construction Admin Dashboard</p>
    <input type="text" id="login-number" placeholder="Your WhatsApp number (e.g. +447803428001)" />
    <input type="password" id="login-password" placeholder="Dashboard password" />
    <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
    <p class="error-msg" id="login-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div>
      <h1>⚡ SubSync <span id="company-name-header"></span></h1>
    </div>
    <div class="header-right">
      <button class="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <main>
    <div id="dashboard-content">
      <div class="loading"><div class="spinner"></div><br><br>Loading your dashboard...</div>
    </div>
  </main>
</div>

<!-- GENERATE MODAL -->
<div class="modal-overlay" id="generate-modal" style="display:none">
  <div class="modal">
    <h3>📄 Generate Document</h3>
    <p id="generate-modal-site"></p>
    <div class="form-group">
      <label>Document Type</label>
      <select id="gen-doc-type">
        <option value="VARIATION">Variation Order (VO)</option>
        <option value="DAYWORK">Daywork Sheet (DS)</option>
        <option value="MATERIAL_ORDER">Purchase Order (PO)</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('generate-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="confirmGenerate()">Generate PDF</button>
    </div>
  </div>
</div>

<!-- EMAIL MODAL -->
<div class="modal-overlay" id="email-modal" style="display:none">
  <div class="modal">
    <h3>📧 Send to Client</h3>
    <p id="email-modal-doc"></p>
    <div class="form-group">
      <label>Client Email Address</label>
      <input type="email" id="email-to" placeholder="client@example.com" />
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('email-modal')">Cancel</button>
      <button class="btn btn-green" onclick="confirmSendEmail()">Send Email</button>
    </div>
  </div>
</div>

<script>
  let STATE = {
    password: "",
    number: "",
    data: null,
    currentSite: null,
    currentPdf: null,
    currentDoc: null,
  };

  // ── Auth ──────────────────────────────────────────────────────────────────
  async function doLogin() {
    const number = document.getElementById("login-number").value.trim();
    const password = document.getElementById("login-password").value.trim();
    if (!number || !password) { showLoginError("Please fill in both fields."); return; }

    const r = await fetch("/api/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password })
    });
    const d = await r.json();
    if (d.ok) {
      STATE.password = password;
      STATE.number = number;
      localStorage.setItem("ss_password", password);
      localStorage.setItem("ss_number", number);
      showApp();
    } else {
      showLoginError("Wrong password. Try again.");
    }
  }

  function logout() {
    localStorage.removeItem("ss_password");
    localStorage.removeItem("ss_number");
    STATE = { password: "", number: "", data: null, currentSite: null, currentPdf: null, currentDoc: null };
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("app").style.display = "none";
  }

  function showLoginError(msg) {
    document.getElementById("login-error").textContent = msg;
  }

  async function showApp() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    await loadDashboard();
  }

  function apiFetch(url, opts = {}) {
    return fetch(url, {
      ...opts,
      headers: {
        "Content-Type": "application/json",
        "X-Dashboard-Password": STATE.password,
        ...(opts.headers || {})
      }
    });
  }

  // ── Load dashboard ────────────────────────────────────────────────────────
  async function loadDashboard() {
    document.getElementById("dashboard-content").innerHTML =
      `<div class="loading"><div class="spinner"></div><br><br>Loading...</div>`;

    const r = await apiFetch(`/api/summary?number=${encodeURIComponent(STATE.number)}`);
    const d = await r.json();
    STATE.data = d;

    document.getElementById("company-name-header").textContent =
      d.company?.company_name ? `— ${d.company.company_name}` : "";

    renderDashboard(d);
  }

  function renderDashboard(d) {
    const bySite = d.by_site || {};
    const sites  = Object.keys(bySite);

    let html = `
      <div class="cards">
        <div class="card">
          <div class="card-label">Pending Items</div>
          <div class="card-value">${d.total_pending}</div>
          <div class="card-sub">Awaiting document generation</div>
        </div>
        <div class="card">
          <div class="card-label">Total Est. Value</div>
          <div class="card-value">£${(d.total_value||0).toFixed(2)}</div>
          <div class="card-sub">Across all pending items</div>
        </div>
        <div class="card">
          <div class="card-label">Total Hours</div>
          <div class="card-value">${(d.total_hours||0).toFixed(1)}</div>
          <div class="card-sub">Logged pending hours</div>
        </div>
        <div class="card">
          <div class="card-label">Active Sites</div>
          <div class="card-value">${d.sites}</div>
          <div class="card-sub">Projects in progress</div>
        </div>
      </div>`;

    if (sites.length === 0) {
      html += `<div class="empty">✅ No pending items. All caught up!</div>`;
    } else {
      html += `<div class="section-title">📋 Pending Items by Site <span class="badge badge-amber">${d.total_pending}</span></div>`;
      for (const site of sites) {
        const s = bySite[site];
        html += renderSiteBlock(site, s, d.company);
      }
    }

    if (d.recent_sent && d.recent_sent.length > 0) {
      html += `<div class="section-title">✅ Recently Sent</div><div class="sent-list">`;
      for (const log of d.recent_sent) {
        const date = new Date(log.created_at).toLocaleDateString("en-GB");
        html += `
          <div class="sent-item">
            <div>
              <span class="type-badge type-${log.type}">${log.type?.replace("_"," ")}</span>
              &nbsp;${log.description || "—"}
              ${log.site_name ? `<span> · ${log.site_name}</span>` : ""}
            </div>
            <span>${date}</span>
          </div>`;
      }
      html += `</div>`;
    }

    document.getElementById("dashboard-content").innerHTML = html;
  }

  function renderSiteBlock(site, s, company) {
    let rows = "";
    for (const log of s.logs) {
      const date = new Date(log.created_at).toLocaleDateString("en-GB");
      rows += `<tr>
        <td><span class="type-badge type-${log.type}">${(log.type||"").replace("_"," ")}</span></td>
        <td>${log.description || "—"}</td>
        <td>${log.location || "—"}</td>
        <td>${log.hours ? log.hours + " hrs" : "—"}</td>
        <td>${log.cost_estimate ? "£" + parseFloat(log.cost_estimate).toFixed(2) : "—"}</td>
        <td>${date}</td>
      </tr>`;
    }

    return `
      <div class="site-block">
        <div class="site-header">
          <div>
            <div class="site-name">📍 ${site}</div>
            <div class="site-meta">${s.count} item(s) · £${s.value.toFixed(2)} · ${s.hours.toFixed(1)} hrs</div>
          </div>
          <div class="site-actions">
            <button class="btn btn-outline btn-sm" onclick="openGenerateModal('${site}')">
              📄 Generate PDF
            </button>
          </div>
        </div>
        <table>
          <thead><tr>
            <th>Type</th><th>Description</th><th>Location</th>
            <th>Hours</th><th>Est. Cost</th><th>Date</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // ── Generate modal ────────────────────────────────────────────────────────
  function openGenerateModal(site) {
    STATE.currentSite = site;
    document.getElementById("generate-modal-site").textContent =
      `Generating document for: ${site}`;
    document.getElementById("generate-modal").style.display = "flex";
  }

  async function confirmGenerate() {
    const docType = document.getElementById("gen-doc-type").value;
    closeModal("generate-modal");
    showToast("⏳ Generating PDF...", "");

    const r = await apiFetch("/api/generate", {
      method: "POST",
      body: JSON.stringify({
        site_name:   STATE.currentSite,
        doc_type:    docType,
        from_number: STATE.number,
      })
    });
    const d = await r.json();

    if (d.ok) {
      STATE.currentPdf = d;
      showToast("✅ PDF generated!", "success");
      openEmailModal(d);
      await loadDashboard();
    } else {
      showToast("❌ " + (d.error || "Failed"), "error");
    }
  }

  // ── Email modal ───────────────────────────────────────────────────────────
  function openEmailModal(docData) {
    STATE.currentDoc = docData;
    document.getElementById("email-modal-doc").textContent =
      `${docData.doc_ref} ready (${docData.items} items). Send to client?`;
    document.getElementById("email-modal").style.display = "flex";
  }

  async function confirmSendEmail() {
    const to = document.getElementById("email-to").value.trim();
    if (!to) { showToast("Please enter an email address", "error"); return; }
    closeModal("email-modal");
    showToast("📧 Sending email...", "");

    const r = await apiFetch("/api/send-email", {
      method: "POST",
      body: JSON.stringify({
        to_email:     to,
        pdf_url:      STATE.currentDoc.pdf_url,
        doc_ref:      STATE.currentDoc.doc_ref,
        site_name:    STATE.currentSite,
        company_name: STATE.data?.company?.company_name || "Company",
        filename:     STATE.currentDoc.filename,
      })
    });
    const d = await r.json();

    if (d.ok) {
      showToast("✅ Email sent to client!", "success");
    } else {
      showToast("❌ " + (d.error || "Failed"), "error");
    }
  }

  // ── Helpers ───────────────────────────────────────────────────────────────
  function closeModal(id) {
    document.getElementById(id).style.display = "none";
  }

  function showToast(msg, type = "") {
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  // ── Auto-login ────────────────────────────────────────────────────────────
  window.addEventListener("DOMContentLoaded", () => {
    const pw  = localStorage.getItem("ss_password");
    const num = localStorage.getItem("ss_number");
    if (pw && num) {
      document.getElementById("login-number").value   = num;
      document.getElementById("login-password").value = pw;
      STATE.password = pw;
      STATE.number   = num;
      showApp();
    }
  });

  // Enter key on login
  document.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && document.getElementById("login-screen").style.display !== "none") {
      doLogin();
    }
  });
</script>
</body>
</html>
