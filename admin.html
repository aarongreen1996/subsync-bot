<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SubSync Admin</title>
<style>
  :root {
    --brand: #1a3a6b; --brand-light: #2a5298; --accent: #f59e0b;
    --green: #10b981; --red: #ef4444; --orange: #f97316;
    --bg: #f1f5f9; --card: #ffffff; --border: #e2e8f0;
    --text: #1e293b; --muted: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: var(--bg); color: var(--text); min-height: 100vh; }

  /* Login */
  #login-screen { min-height: 100vh; display: flex; align-items: center;
                  justify-content: center;
                  background: linear-gradient(135deg, #0f2447, #1a3a6b); }
  .login-box { background: white; border-radius: 16px; padding: 48px 40px;
               width: 100%; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .login-box h1 { font-size: 22px; color: var(--brand); margin-bottom: 4px; }
  .login-box p  { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .login-box input { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border);
                     border-radius: 8px; font-size: 15px; margin-bottom: 12px; outline: none; }
  .login-box input:focus { border-color: var(--brand); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px;
         border-radius: 8px; font-size: 14px; font-weight: 600; border: none;
         cursor: pointer; transition: all .15s; }
  .btn-primary { background: var(--brand); color: white; width: 100%;
                 justify-content: center; padding: 13px; }
  .btn-primary:hover { background: var(--brand-light); }
  .btn-red { background: var(--red); color: white; font-size: 12px; padding: 6px 12px; }
  .btn-red:hover { opacity: .85; }
  .btn-outline { background: white; color: var(--brand); border: 1.5px solid var(--brand);
                 font-size: 12px; padding: 6px 12px; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 8px; }

  /* App */
  #app { display: none; }
  header { background: var(--brand); color: white; padding: 0 28px; height: 60px;
           display: flex; align-items: center; justify-content: space-between;
           position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 18px; font-weight: 700; }
  .logout-btn { background: rgba(255,255,255,.15); border: none; color: white;
                padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; }

  main { max-width: 1200px; margin: 0 auto; padding: 28px 20px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
  @media(max-width:700px) { .stats { grid-template-columns: repeat(2,1fr); } }
  .stat-card { background: var(--card); border-radius: 12px; padding: 20px 22px;
               border: 1px solid var(--border); }
  .stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                letter-spacing: .5px; margin-bottom: 6px; }
  .stat-value { font-size: 30px; font-weight: 800; color: var(--brand); }
  .stat-sub   { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .stat-value.green { color: var(--green); }
  .stat-value.amber { color: var(--accent); }

  /* Section */
  .section-title { font-size: 16px; font-weight: 700; color: var(--brand);
                   margin: 0 0 14px; }

  /* Table */
  .table-wrap { background: var(--card); border-radius: 12px; border: 1px solid var(--border);
                overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.04); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { background: #f8fafc; color: var(--muted); font-size: 11px; text-transform: uppercase;
       letter-spacing: .4px; padding: 10px 16px; text-align: left; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; cursor: pointer; }

  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 3px 8px;
           border-radius: 20px; text-transform: uppercase; }
  .badge-green   { background: #d1fae5; color: #065f46; }
  .badge-amber   { background: #fef3c7; color: #92400e; }
  .badge-red     { background: #fee2e2; color: #991b1b; }
  .badge-grey    { background: #f1f5f9; color: #475569; }

  .color-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%;
               border: 1px solid rgba(0,0,0,.1); vertical-align: middle; margin-right: 6px; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45);
                   display: flex; align-items: flex-start; justify-content: center;
                   z-index: 200; padding: 40px 20px; overflow-y: auto; }
  .modal { background: white; border-radius: 14px; padding: 32px;
           width: 100%; max-width: 700px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .modal h3 { font-size: 18px; color: var(--brand); margin-bottom: 4px; }
  .modal-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .info-item label { display: block; font-size: 11px; color: var(--muted);
                     text-transform: uppercase; letter-spacing: .4px; margin-bottom: 3px; }
  .info-item span { font-size: 14px; font-weight: 600; }

  .mini-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  .mini-table th { background: #f8fafc; padding: 7px 10px; text-align: left;
                   font-size: 10px; color: var(--muted); text-transform: uppercase; }
  .mini-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); }

  /* Misc */
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #e2e8f0;
             border-top-color: var(--brand); border-radius: 50%;
             animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--brand);
           color: white; padding: 12px 20px; border-radius: 10px; font-size: 14px;
           z-index: 300; box-shadow: 0 4px 20px rgba(0,0,0,.25); }
  .toast.success { background: var(--green); }
  .toast.error   { background: var(--red); }
  .empty { text-align: center; padding: 32px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>⚡ SubSync Admin</h1>
    <p>Internal admin panel — authorised access only</p>
    <input type="password" id="admin-password" placeholder="Admin password" />
    <button class="btn btn-primary" onclick="doLogin()">Sign In</button>
    <p class="error-msg" id="login-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h1>⚡ SubSync Admin</h1>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </header>
  <main>
    <div id="content">
      <div class="loading"><div class="spinner"></div><br><br>Loading...</div>
    </div>
  </main>
</div>

<!-- CUSTOMER MODAL -->
<div class="modal-overlay" id="customer-modal" style="display:none">
  <div class="modal">
    <h3 id="modal-company-name">Company</h3>
    <div class="modal-sub" id="modal-company-sub"></div>
    <div class="modal-grid" id="modal-info"></div>
    <div style="margin-bottom:12px">
      <strong style="font-size:13px;color:var(--brand)">📍 Active Sites</strong>
      <div id="modal-sites"></div>
    </div>
    <div>
      <strong style="font-size:13px;color:var(--brand)">📋 Recent Logs (last 10)</strong>
      <div id="modal-logs"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-red" id="cancel-sub-btn" onclick="cancelSubscription()" style="display:none">
        Cancel Subscription
      </button>
      <button class="btn btn-outline" onclick="closeModal()">Close</button>
    </div>
  </div>
</div>

<script>
  let STATE = { password: "", data: null, currentCustomer: null };

  async function doLogin() {
    const pw = document.getElementById("admin-password").value.trim();
    const r  = await fetch("/api/admin/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw })
    });
    const d = await r.json();
    if (d.ok) {
      STATE.password = pw;
      localStorage.setItem("ss_admin_pw", pw);
      showApp();
    } else {
      document.getElementById("login-error").textContent = "Wrong password.";
    }
  }

  function logout() {
    localStorage.removeItem("ss_admin_pw");
    location.reload();
  }

  function apiFetch(url, opts = {}) {
    return fetch(url, {
      ...opts,
      headers: { "Content-Type": "application/json",
                 "X-Admin-Password": STATE.password, ...(opts.headers||{}) }
    });
  }

  async function showApp() {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    await loadOverview();
  }

  async function loadOverview() {
    document.getElementById("content").innerHTML =
      `<div class="loading"><div class="spinner"></div><br><br>Loading customers...</div>`;
    const r = await apiFetch("/api/admin/overview");
    const d = await r.json();
    STATE.data = d;
    renderOverview(d);
  }

  function renderOverview(d) {
    const statusBadge = (s) => {
      if (s === "active")    return `<span class="badge badge-green">Active</span>`;
      if (s === "trialing")  return `<span class="badge badge-amber">Trial</span>`;
      if (s === "canceled")  return `<span class="badge badge-red">Cancelled</span>`;
      return `<span class="badge badge-grey">${s || "Unknown"}</span>`;
    };

    let rows = "";
    for (const c of (d.customers || [])) {
      const date = c.created_at ? new Date(c.created_at).toLocaleDateString("en-GB") : "—";
      rows += `
        <tr onclick="openCustomer(${c.id})">
          <td>
            <span class="color-dot" style="background:${c.primary_color}"></span>
            <strong>${c.company_name}</strong>
          </td>
          <td>${c.email || "—"}</td>
          <td>${statusBadge(c.stripe_status)}</td>
          <td>${c.sites}</td>
          <td>${c.total_logs}</td>
          <td>${c.sent_docs}</td>
          <td><span class="${c.pending_items > 0 ? 'badge badge-amber' : ''}">${c.pending_items || 0}</span></td>
          <td>${date}</td>
        </tr>`;
    }

    document.getElementById("content").innerHTML = `
      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Total Customers</div>
          <div class="stat-value">${d.total_customers}</div>
          <div class="stat-sub">${d.active_count} active · ${d.trial_count} trialing</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Monthly Revenue</div>
          <div class="stat-value green">£${(d.mrr||0).toFixed(0)}</div>
          <div class="stat-sub">MRR from active subscriptions</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Total Logs</div>
          <div class="stat-value amber">${d.total_logs}</div>
          <div class="stat-sub">${d.total_sent} sent · ${d.total_pending} pending</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Trials Active</div>
          <div class="stat-value">${d.trial_count}</div>
          <div class="stat-sub">Converting in 14 days</div>
        </div>
      </div>

      <div class="section-title">👥 All Customers</div>
      <div class="table-wrap">
        ${d.customers?.length ? `
        <table>
          <thead><tr>
            <th>Company</th><th>Email</th><th>Status</th>
            <th>Sites</th><th>Total Logs</th><th>Docs Sent</th>
            <th>Pending</th><th>Joined</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<div class="empty">No customers yet. Share your landing page to get started!</div>`}
      </div>`;
  }

  async function openCustomer(id) {
    const r = await apiFetch(`/api/admin/customer/${id}`);
    const d = await r.json();
    STATE.currentCustomer = d;

    const c = d.company;
    document.getElementById("modal-company-name").textContent = c.company_name;
    document.getElementById("modal-company-sub").textContent =
      `${c.email} · ${c.phone || "No phone"} · Joined ${new Date(c.created_at).toLocaleDateString("en-GB")}`;

    document.getElementById("modal-info").innerHTML = `
      <div class="info-item"><label>Trade</label><span>${c.trade || "—"}</span></div>
      <div class="info-item"><label>WhatsApp</label><span>${c.whatsapp_number}</span></div>
      <div class="info-item"><label>VAT Number</label><span>${c.vat_number || "—"}</span></div>
      <div class="info-item"><label>Address</label><span>${c.address || "—"}</span></div>
    `;

    // Sites
    const sites = d.projects || [];
    document.getElementById("modal-sites").innerHTML = sites.length
      ? sites.map(s => `<span class="badge badge-grey" style="margin:4px 4px 0 0">📍 ${s.site_name}</span>`).join("")
      : `<p style="color:var(--muted);font-size:13px;margin-top:6px">No sites added yet</p>`;

    // Logs
    const logs = (d.logs || []).slice(0, 10);
    document.getElementById("modal-logs").innerHTML = logs.length ? `
      <table class="mini-table">
        <thead><tr><th>Type</th><th>Description</th><th>Site</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>${logs.map(l => `
          <tr>
            <td>${l.type || "—"}</td>
            <td>${l.description || "—"}</td>
            <td>${l.site_name || "—"}</td>
            <td>${l.status}</td>
            <td>${new Date(l.created_at).toLocaleDateString("en-GB")}</td>
          </tr>`).join("")}
        </tbody>
      </table>` : `<p style="color:var(--muted);font-size:13px;margin-top:6px">No logs yet</p>`;

    document.getElementById("customer-modal").style.display = "flex";
  }

  async function cancelSubscription() {
    if (!confirm("Are you sure you want to cancel this subscription?")) return;
    const subId = STATE.currentCustomer?.stripe_sub_id;
    if (!subId) { showToast("No subscription found", "error"); return; }

    const r = await apiFetch("/api/admin/cancel-subscription", {
      method: "POST",
      body: JSON.stringify({ subscription_id: subId })
    });
    const d = await r.json();
    if (d.ok) {
      showToast("Subscription cancelled", "success");
      closeModal();
      await loadOverview();
    } else {
      showToast("Error: " + d.error, "error");
    }
  }

  function closeModal() {
    document.getElementById("customer-modal").style.display = "none";
  }

  function showToast(msg, type = "") {
    const t = document.createElement("div");
    t.className = `toast ${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }

  // Auto login
  window.addEventListener("DOMContentLoaded", () => {
    const pw = localStorage.getItem("ss_admin_pw");
    if (pw) { STATE.password = pw; showApp(); }
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin();
    if (e.key === "Escape") closeModal();
  });
</script>
</body>
</html>
