<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script>
const _t=localStorage.getItem('n2q-theme');
if(_t){document.documentElement.setAttribute('data-theme',_t);}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Note2Quote</title>



<style>
:root {
  --red: #d62828; --red-dark: #b01f1f; --red-light: #fce8e8;
  --cream: #fff3e0; --ink: #0f0a00; --ink-light: #3d3020;
  --muted: #8a7560; --border: #e8ddd0; --white: #fff; --bg: #faf8f5;
  --green: #16a34a; --amber: #d97706;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Manrope', sans-serif; background: #0a0a0a;
       color: #ffffff; min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* Login */
#login-screen { min-height: 100vh; display: flex; align-items: center;
                justify-content: center; background: #111111; }
.login-box { background: white; border: 1px solid #222222;
             border-radius: 20px; padding: 48px 44px; width: 100%; max-width: 380px; }
.login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; font-weight: 900;
              color: #ffffff; margin-bottom: 6px; }
.login-logo em { color: #f59e0b; font-style: normal; }
.login-box p { color: #888888; font-size: 14px; margin-bottom: 24px; font-weight: 300; }
.login-box input { width: 100%; padding: 11px 14px; border: 1.5px solid #222222;
                   border-radius: 10px; font-size: 14px; font-family: 'Manrope', sans-serif;
                   outline: none; margin-bottom: 12px; }
.login-box input:focus { border-color: #f59e0b; }

/* App */
#app { display: none; }
header { background: white; border-bottom: 1px solid #222222;
         padding: 0 32px; height: 64px;
         display: flex; align-items: center; justify-content: space-between;
         position: sticky; top: 0; z-index: 100; }
.header-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; font-weight: 900; color: #ffffff; }
.header-logo em { color: #f59e0b; font-style: normal; }
.header-nav { display: flex; gap: 8px; }
.nav-link { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
            color: #888888; text-decoration: none; transition: all 0.15s; }
.nav-link:hover { background: #0a0a0a; color: #ffffff; }
.nav-link.active { background: #1a1500; color: #f59e0b; font-weight: 600; }
.logout-btn { background: none; border: 1.5px solid #222222; color: #cccccc;
              padding: 7px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
              font-family: 'Manrope', sans-serif; transition: all 0.15s; }
.logout-btn:hover { border-color: #f59e0b; color: #f59e0b; }

main { max-width: 900px; margin: 0 auto; padding: 36px 24px; }

/* Section */
.section { background: white; border: 1px solid #222222; border-radius: 16px;
           overflow: hidden; margin-bottom: 20px; }
.section-header { padding: 20px 28px; border-bottom: 1px solid #222222;
                  display: flex; align-items: center; justify-content: space-between; }
.section-title { font-family: 'Bebas Neue', sans-serif; font-size: 18px; font-weight: 700;
                 color: #ffffff; letter-spacing: -0.3px; }
.section-body { padding: 28px; }

/* Subscription card */
.sub-card { display: flex; align-items: center; justify-content: space-between;
            background: #0a0a0a; border: 1px solid #222222;
            border-radius: 12px; padding: 20px 24px; flex-wrap: wrap; gap: 16px; }
.sub-status { display: flex; align-items: center; gap: 12px; }
.status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.status-dot.active   { background: var(--green); }
.status-dot.trialing { background: var(--amber); }
.status-dot.canceled { background: #f59e0b; }
.sub-name { font-weight: 700; font-size: 15px; }
.sub-detail { font-size: 13px; color: #888888; margin-top: 2px; }

/* Form */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media(max-width:600px) { .form-grid { grid-template-columns: 1fr; } }
.form-group { margin-bottom: 0; }
.form-group label { display: block; font-size: 12px; font-weight: 600;
                    color: #cccccc; margin-bottom: 6px; letter-spacing: 0.2px; }
.form-group input { width: 100%; padding: 11px 14px; border: 1.5px solid #222222;
                    border-radius: 10px; font-size: 14px; font-family: 'Manrope', sans-serif;
                    outline: none; color: #ffffff; }
.form-group input:focus { border-color: #f59e0b; }
.color-row { display: flex; gap: 10px; align-items: center; }
.color-row input[type="color"] { width: 44px; height: 44px; padding: 2px 3px;
                                  border-radius: 10px; cursor: pointer; flex-shrink: 0; }
.form-actions { display: flex; justify-content: flex-end; margin-top: 20px; }

/* Sites */
.site-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.site-item { display: flex; align-items: center; justify-content: space-between;
             background: #0a0a0a; border: 1px solid #222222;
             border-radius: 10px; padding: 12px 16px; }
.site-item-info h4 { font-size: 14px; font-weight: 600; color: #ffffff; }
.site-item-info p { font-size: 12px; color: #888888; margin-top: 2px; }
.add-site-form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px;
                 align-items: end; background: #0a0a0a;
                 border: 1.5px dashed #222222; border-radius: 12px; padding: 16px; }
@media(max-width:600px) { .add-site-form { grid-template-columns: 1fr; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px;
       border-radius: 8px; font-size: 14px; font-weight: 600; border: none;
       cursor: pointer; font-family: 'Manrope', sans-serif; transition: all 0.15s; }
.btn-primary { background: #f59e0b; color: white; width: 100%;
               justify-content: center; padding: 13px; }
.btn-primary:hover { background: #d97706; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-save { background: #ffffff; color: white; }
.btn-save:hover { background: #f59e0b; }
.btn-sm { padding: 7px 14px; font-size: 13px; }
.btn-red-sm { background: #1a1500; color: #f59e0b; border: none;
              padding: 6px 12px; border-radius: 6px; font-size: 12px;
              font-weight: 600; cursor: pointer; font-family: 'Manrope', sans-serif; }
.btn-red-sm:hover { background: #f59e0b; color: white; }
.btn-outline { background: white; color: #ffffff; border: 1.5px solid #222222; }
.btn-outline:hover { border-color: #ffffff; }
.btn-green { background: var(--green); color: white; }

/* States */
.loading { text-align: center; padding: 48px; color: #888888; }
.spinner { display: inline-block; width: 24px; height: 24px; border: 2.5px solid #222222;
           border-top-color: #f59e0b; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 24px; right: 24px; background: #ffffff; color: white;
         padding: 12px 20px; border-radius: 10px; font-size: 14px; z-index: 300;
         box-shadow: 0 8px 24px rgba(0,0,0,0.15); animation: fadeUp 0.2s ease; }
.toast.success { background: var(--green); }
.toast.error   { background: #f59e0b; }
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.error-msg { color: #f59e0b; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="n2q-logo" viewBox="0 0 40 40">
    <path d="M20 5h10l9 9v18a2 2 0 01-2 2H20a2 2 0 01-2-2V7a2 2 0 012-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M30 5v9h9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="23" y1="20" x2="35" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="23" y1="25" x2="31" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="3" y="11" width="10" height="14" rx="5" fill="#f59e0b"/>
    <path d="M1 21.5a7 7 0 0014 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="28.5" x2="8" y2="33" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="5" y1="33" x2="11" y2="33" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>
</svg>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo" style="display:flex;align-items:center;gap:8px;"><svg width="22" height="22" viewBox="0 0 40 40"><use href="#n2q-logo" color="currentColor"/></svg>Note2Quote</div>
    <p>Sign in to manage your account</p>
    <input type="text" id="login-number" placeholder="Your WhatsApp number (+447...)" />
    <input type="password" id="login-password" placeholder="Your password" />
    <button class="btn btn-primary" onclick="doLogin()">Sign in →</button>
    <p class="error-msg" id="login-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <div class="header-logo" style="display:flex;align-items:center;gap:8px;"><svg width="20" height="20" viewBox="0 0 40 40"><use href="#n2q-logo" color="currentColor"/></svg>Note2Quote</div>
    <nav class="header-nav">
      <a href="/dashboard" class="nav-link">Dashboard</a>
      <a href="/account" class="nav-link active">My Account</a>
    </nav>
    <button class="logout-btn" onclick="logout()">Sign out</button>
  </header>

  <main id="main-content">
    <div class="loading"><div class="spinner"></div></div>
  </main>
</div>

<script>
let STATE = { password: "", number: "", data: null };

async function doLogin() {
  const number   = document.getElementById("login-number").value.trim();
  const password = document.getElementById("login-password").value.trim();
  if (!number || !password) { document.getElementById("login-error").textContent = "Please fill in both fields."; return; }

  const r = await fetch("/api/auth", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ password })
  });
  const d = await r.json();
  if (d.ok) {
    STATE.password = password; STATE.number = number;
    localStorage.setItem("ss_password", password);
    localStorage.setItem("ss_number", number);
    showApp();
  } else { document.getElementById("login-error").textContent = "Wrong password."; }
}

function logout() {
  localStorage.removeItem("ss_password"); localStorage.removeItem("ss_number");
  location.reload();
}

function apiFetch(url, opts = {}) {
  return fetch(url, { ...opts, headers: { "Content-Type": "application/json",
    "X-Dashboard-Password": STATE.password, ...(opts.headers||{}) } });
}

async function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app").style.display = "block";
  await loadAccount();
}

async function loadAccount() {
  const r = await apiFetch(`/api/account?number=${encodeURIComponent(STATE.number)}`);
  const d = await r.json();
  STATE.data = d;
  renderAccount(d);
}

function renderAccount(d) {
  const c  = d.company || {};
  const ps = d.projects || [];
  const s  = d.stripe || {};

  const subStatus = s.status || "unknown";
  const dotClass  = subStatus === "active" ? "active" : subStatus === "trialing" ? "trialing" : "canceled";
  const subLabel  = subStatus === "active" ? "Active subscription" : subStatus === "trialing" ? "Free trial" : subStatus;
  const nextDate  = s.next_billing ? new Date(s.next_billing * 1000).toLocaleDateString("en-GB") : "—";
  const trialDate = s.trial_end   ? new Date(s.trial_end * 1000).toLocaleDateString("en-GB") : null;

  const sitesHtml = ps.length ? ps.map(p => `
    <div class="site-item">
      <div class="site-item-info">
        <h4>📍 ${p.site_name}</h4>
        <p>${p.client_name || "No client name set"}</p>
      </div>
      <button class="btn-red-sm" onclick="deleteSite(${p.id}, '${p.site_name}')">Remove</button>
    </div>`).join("") : `<p style="color:#888888;font-size:14px;margin-bottom:16px">No sites added yet. Add your first site below.</p>`;

  document.getElementById("main-content").innerHTML = `

    <!-- Subscription -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Subscription</div>
      </div>
      <div class="section-body">
        <div class="sub-card">
          <div class="sub-status">
            <div class="status-dot ${dotClass}"></div>
            <div>
              <div class="sub-name">Note2Quote Monthly — £49/month</div>
              <div class="sub-detail">${subLabel}${trialDate ? " · Trial ends " + trialDate : ""}${subStatus === "active" ? " · Next billing " + nextDate : ""}</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;flex-wrap:wrap">
            ${s.billing_url ? `<a href="${s.billing_url}" target="_blank" class="btn btn-outline btn-sm">Manage billing →</a>` : ""}
            <button class="btn btn-outline btn-sm" style="color:var(--amber);border-color:var(--amber)" onclick="pauseSubscription()">⏸ Pause</button>
            <button class="btn btn-outline btn-sm" style="color:#dc2626;border-color:#dc2626" onclick="cancelSubscription()">✕ Cancel</button>
          </div>
        </div>
      </div>
      </div>
    </div>

    <!-- Logo Upload -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Company Logo</div>
      </div>
      <div class="section-body">
        <p style="font-size:14px;color:#888888;margin-bottom:16px;font-weight:300">
          Your logo will appear on all branded PDF documents sent to clients.
        </p>
        <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
          ${c.logo_url ? `<img src="${c.logo_url}" style="max-height:60px;max-width:200px;border:1px solid #222222;border-radius:8px;padding:8px;background:white" alt="Logo" />` : `<div style="width:120px;height:60px;border:2px dashed #222222;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#888888;font-size:12px">No logo</div>`}
          <div>
            <input type="file" id="logo-file" accept="image/*" style="display:none" onchange="uploadLogo(this)" />
            <button class="btn btn-outline" onclick="document.getElementById('logo-file').click()">
              ${c.logo_url ? 'Change logo' : 'Upload logo'}
            </button>
            <p style="font-size:11px;color:#888888;margin-top:6px">PNG, JPG or SVG · Max 2MB · Transparent background recommended</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Company Details -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Company Details</div>
      </div>
      <div class="section-body">
        <div class="form-grid">
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" id="f-company-name" value="${c.company_name || ""}" />
          </div>
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="f-email" value="${c.email || ""}" />
          </div>
          <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="f-phone" value="${c.phone || ""}" />
          </div>
          <div class="form-group">
            <label>VAT Number</label>
            <input type="text" id="f-vat" value="${c.vat_number || ""}" />
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label>Company Address</label>
            <input type="text" id="f-address" value="${c.address || ""}" />
          </div>
          <div class="form-group">
            <label>Brand Colour</label>
            <div class="color-row">
              <input type="color" id="f-color-picker" value="${c.primary_color || "#d62828"}"
                     oninput="document.getElementById('f-color-hex').value=this.value" />
              <input type="text" id="f-color-hex" value="${c.primary_color || "#d62828"}"
                     oninput="document.getElementById('f-color-picker').value=this.value" />
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-save" onclick="saveCompany()">Save changes</button>
        </div>
      </div>
    </div>

    <!-- Sites -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">My Sites</div>
      </div>
      <div class="section-body">
        <div class="site-list" id="site-list">${sitesHtml}</div>
        <div class="add-site-form">
          <div class="form-group">
            <label>Site Name</label>
            <input type="text" id="new-site-name" placeholder="e.g. Brookfield Site" />
          </div>
          <div class="form-group">
            <label>Client Name</label>
            <input type="text" id="new-client-name" placeholder="e.g. Brookfield Developments Ltd" />
          </div>
          <button class="btn btn-green" onclick="addSite()">Add site</button>
        </div>
      </div>
    </div>

    <!-- WhatsApp info -->
    <div class="section">
      <div class="section-header"><div class="section-title">WhatsApp Bot</div></div>
      <div class="section-body">
        <p style="font-size:14px;color:#888888;margin-bottom:16px;font-weight:300">
          Your bot is connected to this WhatsApp number. Share the bot number with your team so they can log site activity.
        </p>
        <div style="background:#0a0a0a;border:1px solid #222222;border-radius:10px;padding:16px 20px">
          <div style="font-size:12px;color:#888888;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px">Your WhatsApp number</div>
          <div style="font-size:16px;font-weight:700;color:#ffffff">${c.whatsapp_number ? c.whatsapp_number.replace("whatsapp:", "") : "—"}</div>
        </div>
      </div>
    </div>
  `;
}

async function saveCompany() {
  const payload = {
    company_name:  document.getElementById("f-company-name").value.trim(),
    email:         document.getElementById("f-email").value.trim(),
    phone:         document.getElementById("f-phone").value.trim(),
    vat_number:    document.getElementById("f-vat").value.trim(),
    address:       document.getElementById("f-address").value.trim(),
    primary_color: document.getElementById("f-color-hex").value.trim(),
  };

  const r = await apiFetch(`/api/account/company?number=${encodeURIComponent(STATE.number)}`, {
    method: "PATCH", body: JSON.stringify(payload)
  });
  const d = await r.json();
  if (d.ok) { showToast("✓ Details saved!", "success"); }
  else { showToast("❌ " + (d.error || "Failed to save"), "error"); }
}

async function addSite() {
  const site_name   = document.getElementById("new-site-name").value.trim();
  const client_name = document.getElementById("new-client-name").value.trim();
  if (!site_name) { showToast("Please enter a site name", "error"); return; }

  const r = await apiFetch(`/api/account/sites?number=${encodeURIComponent(STATE.number)}`, {
    method: "POST", body: JSON.stringify({ site_name, client_name })
  });
  const d = await r.json();
  if (d.ok) {
    showToast("✓ Site added!", "success");
    document.getElementById("new-site-name").value = "";
    document.getElementById("new-client-name").value = "";
    await loadAccount();
  } else { showToast("❌ " + (d.error || "Failed"), "error"); }
}

async function deleteSite(id, name) {
  if (!confirm(`Remove "${name}" from your active sites?`)) return;
  const r = await apiFetch(`/api/account/sites/${id}`, { method: "DELETE" });
  const d = await r.json();
  if (d.ok) { showToast("Site removed", "success"); await loadAccount(); }
  else { showToast("❌ " + (d.error || "Failed"), "error"); }
}

async function uploadLogo(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast("File too large. Max 2MB.", "error"); return; }

  showToast("Uploading logo...", "");

  const r = await apiFetch(`/api/account/logo?number=${encodeURIComponent(STATE.number)}`, {
    method: "POST",
    headers: { "X-Dashboard-Password": STATE.password },
    body: await fileToBase64(file, file.type),
  });

  const d = await r.json();
  if (d.ok) { showToast("✓ Logo uploaded!", "success"); await loadAccount(); }
  else { showToast("❌ " + (d.error || "Upload failed"), "error"); }
}

function fileToBase64(file, mimeType) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = () => {
      const blob = new Blob([reader.result], { type: mimeType });
      resolve(blob);
    };
    reader.readAsArrayBuffer(file);
  });
}

async function pauseSubscription(){
  if(!confirm('Pause your subscription for one month? You will not be charged but access continues until the end of your current period.'))return;
  const s=STATE.data&&STATE.data.stripe;
  if(s&&s.billing_url){window.open(s.billing_url,'_blank');}
  else{showToast('Open billing portal to manage your subscription','');}
}

async function cancelSubscription(){
  if(!confirm('Are you sure you want to cancel? You will keep access until the end of your billing period.'))return;
  const s=STATE.data&&STATE.data.stripe;
  if(s&&s.billing_url){window.open(s.billing_url,'_blank');}
  else{showToast('Open billing portal to cancel','');}
}

function showToast(msg, type = "") {
  const t = document.createElement("div");
  t.className = `toast ${type}`; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

window.addEventListener("DOMContentLoaded", () => {
  const pw  = localStorage.getItem("ss_password");
  const num = localStorage.getItem("ss_number");
  if (pw && num) { STATE.password = pw; STATE.number = num; showApp(); }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("login-screen").style.display !== "none") doLogin();
});
</script>
</body>
</html>
