<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Note2Quote — From Voice Note to Polished PDF. Instantly.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────────────── */
:root{
  --amber:#f59e0b;--amber-dark:#d97706;--amber-light:#fbbf24;
  --amber-dim:rgba(245,158,11,0.12);--amber-glow:rgba(245,158,11,0.25);
}
[data-theme="light"]{
  --bg:#f5f3ef;--bg2:#ffffff;--bg3:#eceae5;--bg4:#e2dfd8;
  --text:#0c0d10;--text2:#2d2f36;--muted:#6b7280;--faint:#a0a5b0;
  --border:#dddad4;--border2:#c8c4bc;
  --card:#ffffff;--card2:#f9f8f5;
  --nav:rgba(245,243,239,0.92);
  --shadow:rgba(0,0,0,0.08);--shadow2:rgba(0,0,0,0.15);
  --noise-opacity:0.03;
}
[data-theme="dark"]{
  --bg:#0c0d10;--bg2:#131419;--bg3:#1a1b22;--bg4:#21232c;
  --text:#f0ede8;--text2:#c8c4bc;--muted:#8b8fa8;--faint:#4a4d5e;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --card:#131419;--card2:#1a1b22;
  --nav:rgba(12,13,16,0.92);
  --shadow:rgba(0,0,0,0.4);--shadow2:rgba(0,0,0,0.6);
  --noise-opacity:0.05;
}

*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Manrope',sans-serif;
  background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .4s,color .4s;
  cursor:none;
}

/* ─── CUSTOM CURSOR ──────────────────────────────────────────── */
#cursor{position:fixed;width:10px;height:10px;background:var(--amber);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .1s,width .2s,height .2s,opacity .2s;}
#cursor-ring{position:fixed;width:36px;height:36px;border:1.5px solid var(--amber);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .12s ease-out,width .2s,height .2s,opacity .2s,border-color .2s;opacity:0.5;}
body:hover #cursor{opacity:1;}
.magnetic:hover ~ #cursor{width:20px;height:20px;}

/* ─── NOISE TEXTURE ──────────────────────────────────────────── */
body::before{
  content:'';position:fixed;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  opacity:var(--noise-opacity);pointer-events:none;z-index:1;
}

/* ─── PARTICLE CANVAS ────────────────────────────────────────── */
#particle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:0.4;}

/* ─── NAV ────────────────────────────────────────────────────── */
nav{
  position:fixed;top:0;width:100%;z-index:500;
  padding:0 48px;height:68px;
  display:flex;align-items:center;justify-content:space-between;
  background:var(--nav);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  transition:background .4s,border-color .4s;
}
.nav-logo{
  font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;
  color:var(--text);display:flex;align-items:center;gap:10px;
  text-decoration:none;transition:color .3s;
}
.nav-logo svg{transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.nav-logo:hover svg{transform:rotate(-8deg) scale(1.1);}
.nav-links{display:flex;gap:28px;list-style:none;}
.nav-links a{color:var(--muted);font-size:13px;font-weight:500;text-decoration:none;transition:color .2s;position:relative;}
.nav-links a::after{content:'';position:absolute;bottom:-2px;left:0;width:0;height:1.5px;background:var(--amber);transition:width .25s;}
.nav-links a:hover{color:var(--text);}
.nav-links a:hover::after{width:100%;}
.nav-right{display:flex;align-items:center;gap:10px;}
.theme-toggle{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);cursor:none;display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:all .2s;
}
.theme-toggle:hover{border-color:var(--amber);transform:rotate(20deg);}
.nav-cta{
  background:var(--amber);color:#0c0d10;
  padding:9px 22px;border-radius:8px;
  font-size:13px;font-weight:700;text-decoration:none;
  transition:all .2s;letter-spacing:0.3px;
  position:relative;overflow:hidden;
}
.nav-cta::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.2),transparent);
  opacity:0;transition:opacity .2s;
}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--amber-glow);}
.nav-cta:hover::before{opacity:1;}
@media(max-width:768px){nav{padding:0 20px;}.nav-links{display:none;}}

/* ─── HERO ───────────────────────────────────────────────────── */
.hero{
  min-height:100vh;display:flex;align-items:center;
  padding:120px 48px 80px;
  position:relative;overflow:hidden;
}
.hero-inner{
  max-width:1200px;margin:0 auto;width:100%;
  display:grid;grid-template-columns:1fr 500px;gap:80px;align-items:center;
  position:relative;z-index:2;
}
@media(max-width:1060px){.hero-inner{grid-template-columns:1fr;}.hero-right{display:none;}}

/* Animated gradient orb */
.hero-orb{
  position:absolute;top:50%;right:0;transform:translateY(-50%);
  width:700px;height:700px;
  background:radial-gradient(circle,var(--amber-glow) 0%,transparent 70%);
  pointer-events:none;animation:orb-pulse 6s ease-in-out infinite;
}
@keyframes orb-pulse{0%,100%{transform:translateY(-50%) scale(1);opacity:0.6;}50%{transform:translateY(-52%) scale(1.05);opacity:1;}}

.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--amber-dim);border:1px solid rgba(245,158,11,0.3);
  padding:6px 16px;border-radius:100px;
  font-size:11px;font-weight:700;color:var(--amber-dark);
  text-transform:uppercase;letter-spacing:2px;margin-bottom:24px;
  animation:fadeUp .6s ease .1s both;
}
.badge-dot{width:6px;height:6px;background:var(--amber);border-radius:50%;animation:badge-blink 2s ease infinite;}
@keyframes badge-blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* Headline with clip reveal */
.hero-headline{overflow:hidden;margin-bottom:24px;}
h1{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(68px,9vw,120px);
  line-height:0.92;letter-spacing:4px;
  color:var(--text);
  animation:slideUp .8s cubic-bezier(.16,1,.3,1) .2s both;
}
h1 .accent{color:var(--amber);display:inline-block;position:relative;}
h1 .accent::after{
  content:'';position:absolute;bottom:-4px;left:0;right:0;height:3px;
  background:var(--amber);transform:scaleX(0);transform-origin:left;
  animation:underline-grow 0.6s ease .9s forwards;
}
@keyframes underline-grow{to{transform:scaleX(1);}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0;}to{transform:translateY(0);opacity:1;}}

.hero-sub{
  font-size:16px;line-height:1.75;color:var(--muted);
  max-width:460px;margin-bottom:40px;font-weight:400;
  animation:fadeUp .7s ease .4s both;
}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;animation:fadeUp .7s ease .5s both;}

/* 3D Magnetic buttons */
.btn-magnetic{
  padding:14px 28px;border-radius:10px;font-size:14px;
  font-weight:700;text-decoration:none;
  display:inline-flex;align-items:center;gap:8px;
  font-family:'Manrope',sans-serif;letter-spacing:0.3px;
  transition:box-shadow .2s;cursor:none;
  position:relative;transform-style:preserve-3d;
}
.btn-primary-3d{
  background:var(--amber);color:#0c0d10;
  box-shadow:0 4px 0 var(--amber-dark), 0 8px 24px var(--amber-glow);
}
.btn-primary-3d:hover{box-shadow:0 2px 0 var(--amber-dark),0 12px 32px var(--amber-glow);}
.btn-primary-3d:active{box-shadow:0 0 0 var(--amber-dark);}
.btn-secondary-3d{
  background:var(--card);color:var(--text);
  border:1px solid var(--border);
  box-shadow:0 4px 0 var(--border2),0 8px 16px var(--shadow);
}
.btn-secondary-3d:hover{box-shadow:0 2px 0 var(--border2),0 12px 24px var(--shadow2);}

.hero-note{font-size:11px;color:var(--faint);margin-top:16px;letter-spacing:0.5px;animation:fadeUp .7s ease .6s both;}

/* ─── HERO PHONE MOCKUP ──────────────────────────────────────── */
.hero-right{position:relative;}
.phone-scene{
  perspective:1200px;
  animation:float 5s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}

.phone-3d{
  background:#0c0d10;border-radius:40px;
  padding:14px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 40px 80px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.08);
  transform:rotateX(4deg) rotateY(-12deg);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);
  max-width:300px;margin:0 auto;
}
.phone-3d:hover{transform:rotateX(0deg) rotateY(0deg);}
.phone-notch{width:80px;height:24px;background:#0c0d10;border-radius:12px;margin:0 auto 12px;position:relative;z-index:2;}
.phone-screen{
  background:#1a1b22;border-radius:28px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
}
.wa-bar{
  background:#0d0f14;padding:12px 16px;
  display:flex;align-items:center;gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.wa-av{width:32px;height:32px;background:var(--amber);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.wa-n{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;color:#fff;}
.wa-s{font-size:10px;color:rgba(255,255,255,0.4);}
.chat-area{padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg4,#1e2028);}

.msg{display:flex;flex-direction:column;}
.msg.out{align-items:flex-end;}
.bub{
  padding:9px 12px;border-radius:14px;font-size:11.5px;
  line-height:1.5;max-width:90%;font-family:'Manrope',sans-serif;
  position:relative;
}
.bub.out{
  background:linear-gradient(135deg,#1a3a00,#0d2200);
  color:#a3e635;border-bottom-right-radius:3px;
  border:1px solid rgba(163,230,53,0.15);
}
.bub.in{
  background:rgba(245,158,11,0.08);
  color:rgba(255,255,255,0.85);
  border:1px solid rgba(245,158,11,0.15);
  border-bottom-left-radius:3px;
}
.bub-time{font-size:9px;color:rgba(255,255,255,0.25);margin-top:2px;}

/* Floating cards around phone */
.float-card{
  position:absolute;
  background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:14px 18px;
  box-shadow:0 20px 40px var(--shadow2);
  backdrop-filter:blur(10px);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.fc1{right:-40px;top:20px;animation:fc-float1 4s ease-in-out infinite;}
.fc2{left:-50px;bottom:60px;animation:fc-float2 5s ease-in-out infinite;}
@keyframes fc-float1{0%,100%{transform:translateY(0) rotate(2deg);}50%{transform:translateY(-10px) rotate(2deg);}}
@keyframes fc-float2{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-8px) rotate(-1deg);}}
.fc-label{font-size:9px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
.fc-val{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;color:var(--amber);}
.fc-sub{font-size:10px;color:var(--muted);margin-top:2px;}

/* ─── MARQUEE ─────────────────────────────────────────────────── */
.marquee-wrap{
  border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  padding:16px 0;overflow:hidden;background:var(--bg2);
  transition:background .4s,border-color .4s;
  position:relative;z-index:2;
}
.marquee-track{display:flex;animation:marquee 40s linear infinite;width:max-content;}
.marquee-item{
  display:flex;align-items:center;gap:10px;
  padding:0 28px;font-size:10px;font-weight:700;
  color:var(--faint);white-space:nowrap;
  border-right:1px solid var(--border);
  letter-spacing:2.5px;text-transform:uppercase;
  transition:color .3s,border-color .3s;
}
.marquee-dot{width:5px;height:5px;background:var(--amber);border-radius:50%;flex-shrink:0;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ─── SECTION BASE ────────────────────────────────────────────── */
.section{padding:100px 48px;position:relative;z-index:2;}
@media(max-width:768px){.section{padding:64px 20px;}}
.section-inner{max-width:1200px;margin:0 auto;}
.eyebrow{
  display:inline-block;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:3px;color:var(--amber);margin-bottom:14px;
}
.sh{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(48px,6vw,80px);letter-spacing:3px;
  color:var(--text);line-height:0.95;margin-bottom:14px;
  transition:color .4s;
}
.sh-inv{color:#ffffff;}
.sl{font-size:16px;color:var(--muted);max-width:540px;line-height:1.7;font-weight:400;margin-bottom:52px;}
.sl-inv{color:rgba(255,255,255,0.4);}

/* ─── STATS (always dark) ─────────────────────────────────────── */
.stats-section{padding:80px 48px;background:#0c0d10;position:relative;overflow:hidden;z-index:2;}
.stats-section::before{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(245,158,11,0.03) 0px,rgba(245,158,11,0.03) 1px,transparent 1px,transparent 60px),
             repeating-linear-gradient(0deg,rgba(245,158,11,0.03) 0px,rgba(245,158,11,0.03) 1px,transparent 1px,transparent 60px);
}
.stats-inner{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.04);border-radius:20px;overflow:hidden;position:relative;z-index:1;}
@media(max-width:700px){.stats-inner{grid-template-columns:repeat(2,1fr);}}
.stat-item{
  background:#131419;padding:40px 28px;text-align:center;
  transition:background .2s;position:relative;overflow:hidden;
}
.stat-item::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(245,158,11,0.08),transparent 70%);
  opacity:0;transition:opacity .3s;
}
.stat-item:hover{background:#1a1b22;}
.stat-item:hover::before{opacity:1;}
.stat-num{
  font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:2px;
  color:var(--amber);line-height:1;
  background:linear-gradient(135deg,var(--amber),var(--amber-light));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.stat-label{font-size:12px;color:rgba(255,255,255,0.35);margin-top:8px;line-height:1.5;}

/* ─── PROBLEM ────────────────────────────────────────────────── */
.section-alt{background:var(--bg3);transition:background .4s;}
.problems{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:20px;
}
@media(max-width:768px){.problems{grid-template-columns:1fr;}}
.problem-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:36px 32px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;
  transform-style:preserve-3d;
}
.problem-card::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--amber-dim),transparent);
  opacity:0;transition:opacity .3s;border-radius:20px;
}
.problem-card:hover{transform:translateY(-8px) rotateX(2deg);box-shadow:0 24px 48px var(--shadow2);}
.problem-card:hover::before{opacity:1;}
.problem-num{
  font-family:'Bebas Neue',sans-serif;font-size:72px;letter-spacing:2px;
  color:var(--amber);line-height:1;margin-bottom:16px;
  opacity:0.15;
}
.problem-card h3{
  font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1.5px;
  color:var(--text);margin-bottom:10px;transition:color .3s;
}
.problem-card p{font-size:14px;color:var(--muted);line-height:1.7;}

/* ─── HOW IT WORKS ───────────────────────────────────────────── */
.section-dark{background:#0c0d10;}
.steps{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:20px;overflow:hidden;
}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.steps{grid-template-columns:1fr;}}
.step{
  background:#131419;padding:36px 28px;
  position:relative;overflow:hidden;
  transition:background .2s;
}
.step::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);
  transform:scaleX(0);transition:transform .4s;
}
.step:hover{background:#1a1b22;}
.step:hover::after{transform:scaleX(1);}
.step-num{font-size:10px;font-weight:700;color:var(--amber);letter-spacing:2.5px;text-transform:uppercase;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
.step-num::before{content:'';width:20px;height:1px;background:var(--amber);}
.step-icon{
  font-size:32px;margin-bottom:14px;display:block;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.step:hover .step-icon{transform:scale(1.2) rotate(-5deg);}
.step h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:#fff;margin-bottom:8px;}
.step p{font-size:13px;color:rgba(255,255,255,0.4);line-height:1.7;}

/* ─── FEATURES ───────────────────────────────────────────────── */
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
@media(max-width:768px){.features{grid-template-columns:1fr;}}
.feature{
  background:var(--card);border:1px solid var(--border);
  border-radius:20px;padding:32px 28px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;overflow:hidden;cursor:none;
}
.feature-shine{
  position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0.05) 50%,rgba(255,255,255,0) 100%);
  transform:translateX(-100%);transition:transform .5s;
}
.feature:hover .feature-shine{transform:translateX(100%);}
.feature:hover{transform:translateY(-6px);box-shadow:0 20px 40px var(--shadow2);}
.feature-icon{
  width:48px;height:48px;
  background:var(--amber-dim);border:1px solid rgba(245,158,11,0.25);
  border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:18px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1),background .3s;
}
.feature:hover .feature-icon{transform:scale(1.1) rotate(-5deg);background:var(--amber-glow);}
.feature h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.5px;color:var(--text);margin-bottom:8px;}
.feature p{font-size:13px;color:var(--muted);line-height:1.7;}

/* ─── TESTIMONIAL ────────────────────────────────────────────── */
.testimonial-section{
  background:var(--amber);padding:100px 48px;
  position:relative;overflow:hidden;z-index:2;
}
.testimonial-section::before{
  content:'"';
  font-family:'Bebas Neue',sans-serif;font-size:400px;letter-spacing:0;
  color:rgba(0,0,0,0.06);
  position:absolute;top:-80px;left:-20px;line-height:1;pointer-events:none;
}
.t-inner{max-width:800px;margin:0 auto;text-align:center;position:relative;}
.t-quote{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(28px,4vw,52px);letter-spacing:2px;
  color:#0c0d10;line-height:1.1;margin-bottom:28px;
}
.t-author{font-size:13px;color:rgba(12,13,16,0.5);letter-spacing:0.5px;font-weight:500;}
.t-stars{font-size:20px;margin-bottom:20px;letter-spacing:4px;}

/* ─── PRICING ────────────────────────────────────────────────── */
.price-scene{perspective:1200px;max-width:500px;margin:0 auto;}
.price-card{
  background:var(--card);border:1.5px solid var(--border);
  border-radius:24px;overflow:hidden;
  box-shadow:0 32px 64px var(--shadow2);
  transform:rotateX(2deg);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1),box-shadow .5s;
