<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1a1a2e">
<title>Perfect Delivery — Offline</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .icon { font-size: 64px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 700; color: #C5962A; margin-bottom: 10px; }
  p { font-size: 15px; color: #a0a0b0; line-height: 1.6; max-width: 300px; }
  .status { margin-top: 32px; padding: 12px 20px; background: rgba(255,255,255,0.08); border-radius: 10px; font-size: 13px; color: #a0a0b0; }
  .dot { display: inline-block; width: 8px; height: 8px; background: #ef4444; border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .queued { margin-top: 16px; padding: 12px 20px; background: rgba(197,150,42,0.15); border: 1px solid rgba(197,150,42,0.3); border-radius: 10px; font-size: 13px; color: #C5962A; display: none; }
</style>
</head>
<body>
<div class="icon">📶</div>
<h1>No Signal</h1>
<p>You're currently offline. Once you regain signal, any completed forms will upload automatically.</p>
<div class="status">
  <span class="dot"></span>
  Waiting for connection…
</div>
<div class="queued" id="queuedMsg"></div>
<script>
// Check for queued submissions
async function checkQueue() {
  try {
    const db = await new Promise((res, rej) => {
      const r = indexedDB.open('pd-offline-queue', 1);
      r.onsuccess = e => res(e.target.result);
      r.onerror   = rej;
    });
    const items = await new Promise((res, rej) => {
      const tx = db.transaction('queue', 'readonly');
      const r  = tx.objectStore('queue').getAll();
      r.onsuccess = e => res(e.target.result);
      r.onerror   = rej;
    });
    if (items.length) {
      const el = document.getElementById('queuedMsg');
      el.style.display = 'block';
      el.textContent = items.length + ' submission' + (items.length > 1 ? 's' : '') + ' queued — will upload when signal returns';
    }
  } catch(e) {}
}
checkQueue();

// Auto-reload when online
window.addEventListener('online', () => location.reload());

// Notify service worker
if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
  navigator.serviceWorker.controller.postMessage({ type: 'ONLINE' });
}
</script>
</body>
</html>
