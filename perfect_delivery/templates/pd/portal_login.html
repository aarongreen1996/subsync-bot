<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Delivery — Sign In</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    background: #f2f2f7;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .card {
    background: white;
    border-radius: 20px;
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
  }

  .logo-wrap {
    text-align: center;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 64px; height: 64px;
    background: #1a1a2e;
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 4px 12px rgba(26,26,46,0.25);
  }
  .logo-icon span { color: #C5962A; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .logo-title { font-size: 22px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.5px; }
  .logo-sub { font-size: 14px; color: #8e8e93; margin-top: 4px; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #3a3a3c;
    margin-bottom: 8px;
    letter-spacing: -0.1px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #e5e5ea;
    border-radius: 12px;
    font-size: 16px;
    color: #1a1a2e;
    background: #f9f9fb;
    transition: border-color 0.15s, background 0.15s;
    -webkit-appearance: none;
  }
  .field input:focus {
    outline: none;
    border-color: #1a1a2e;
    background: white;
  }

  .error {
    background: #fff2f2;
    border: 1px solid #ffd1d1;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    color: #c0392b;
    margin-bottom: 16px;
    display: none;
  }
  .error.show { display: block; }

  .btn-sign-in {
    width: 100%;
    padding: 15px;
    background: #1a1a2e;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 8px;
    letter-spacing: -0.2px;
  }
  .btn-sign-in:hover { background: #252540; }
  .btn-sign-in:active { transform: scale(0.98); }
  .btn-sign-in:disabled { background: #c7c7cc; cursor: not-allowed; transform: none; }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: #8e8e93;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap">
    {% if tenant and tenant.logo_url %}
    <img src="{{ tenant.logo_url }}" style="height:56px;margin-bottom:14px;display:block;margin-left:auto;margin-right:auto">
    {% else %}
    <div class="logo-icon"><span>PD</span></div>
    {% endif %}
    <div class="logo-title">Perfect Delivery</div>
    <div class="logo-sub">{{ tenant.name if tenant else 'Pennyfarthing Homes' }}</div>
  </div>

  <div class="error" id="errorMsg"></div>

  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@company.com" autocomplete="email" autofocus>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"
      onkeydown="if(event.key==='Enter')signIn()">
  </div>

  <button class="btn-sign-in" id="signInBtn" onclick="signIn()">Sign In</button>

  <div class="footer">Perfect Delivery · {{ tenant.name if tenant else 'Pennyfarthing Homes' }}</div>
</div>

<script>
async function signIn() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('signInBtn');
  const err      = document.getElementById('errorMsg');

  err.classList.remove('show');
  if (!email || !password) {
    err.textContent = 'Please enter your email and password.';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Signing in…';

  try {
    const res = await fetch('/pd/portal/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const json = await res.json();
    if (json.ok) {
      window.location.href = '/pd/portal/dashboard';
    } else {
      err.textContent = json.error || 'Invalid email or password.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  } catch (e) {
    err.textContent = 'Connection error. Please try again.';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
}
</script>
</body>
</html>
