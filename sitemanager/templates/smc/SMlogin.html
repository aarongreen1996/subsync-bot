<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Command Centre</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0a0e1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.card { background: #111827; border: 1px solid #1e293b; border-radius: 16px; padding: 40px; width: 360px; }
.logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
.logo-icon { width: 40px; height: 40px; background: #f97316; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
h1 { font-size: 18px; font-weight: 700; color: #f97316; }
.sub { font-size: 11px; color: #334155; margin-top: 2px; }
label { display: block; font-size: 12px; font-weight: 600; color: #64748b; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
input[type=password] { width: 100%; padding: 12px 14px; background: #0f172a; border: 1.5px solid #1e293b; border-radius: 8px; color: #f1f5f9; font-size: 15px; margin-bottom: 16px; outline: none; }
input[type=password]:focus { border-color: #f97316; }
button { width: 100%; padding: 13px; background: #f97316; border: none; border-radius: 8px; color: #111; font-size: 15px; font-weight: 700; cursor: pointer; }
button:hover { background: #fb923c; }
.error { background: #450a0a; border: 1px solid #dc2626; border-radius: 8px; padding: 10px 12px; color: #f87171; font-size: 13px; margin-bottom: 14px; }
.site { font-size: 11px; color: #1e293b; text-align: center; margin-top: 20px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">🏗️</div>
    <div>
      <h1>Site Command Centre</h1>
      <div class="sub">SS17 · Sandle Park, Fordingbridge</div>
    </div>
  </div>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <label>Access Password</label>
    <input type="password" name="password" placeholder="Enter password" autofocus>
    <button type="submit">Enter →</button>
  </form>
  <div class="site">Pennyfarthing Homes · Site Manager Dashboard</div>
</div>
</body>
</html>
